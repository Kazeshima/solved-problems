name: Verify the Potts BP classification

on:
  push:
    paths:
      - 'problems/potts-bp-nonconvexity/**'
      - '.github/workflows/verify-potts.yml'
  pull_request:
    paths:
      - 'problems/potts-bp-nonconvexity/**'
      - '.github/workflows/verify-potts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: problems/potts-bp-nonconvexity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the manuscripts and verified files
        run: sha256sum --check --quiet classification/VERIFIED.sha256
      - name: Reproduce the rational witness and classification experiments
        run: |
          python -m pip install -r classification/requirements.txt
          python verify.py
          python classification/check_geometry.py
      - name: Install elan
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned Mathlib cache
        run: lake exe cache get
      - name: Build, audit and replay both the short note and the classification
        shell: bash
        run: |
          python classification/verify_formal.py
          diff -u <(grep "^'PottsBP\." results/axioms.log) <(grep "^'PottsBP\." classification/results/original-axioms.log)
          grep -F 'Checked transitive axioms and replay membership' classification/results/classification-replay.log
