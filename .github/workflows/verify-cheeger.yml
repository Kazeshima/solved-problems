name: Verify the Cheeger counterexample and its minimum order

on:
  pull_request:
    paths:
      - 'problems/cheeger-pareto/**'
      - 'problems/mabk-uniform-randomness/review/DependencyReplay.lean'
      - '.github/workflows/verify-cheeger.yml'
  push:
    branches: [main]
    paths:
      - 'problems/cheeger-pareto/**'
      - 'problems/mabk-uniform-randomness/review/DependencyReplay.lean'
      - '.github/workflows/verify-cheeger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-ten-census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and replay the order-ten certificates and orbit counts
        working-directory: problems/cheeger-pareto
        run: python3 verify_order10.py
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: problems/cheeger-pareto
    steps:
      - uses: actions/checkout@v4
      - name: Verify the reviewed source and certificate hashes
        run: sha256sum -c VERIFIED.sha256
      - name: Verify graph6 witness and exact all-real certificates
        run: |
          python3 verify.py
          python3 verify_minimum.py
      - name: Install elan
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and check the least-order theorem
        run: |
          lake exe cache get
          lake build
          lake env lean CheegerMinimum.lean
          lake env lean CheegerTen.lean
          python3 verify_order10.py --row 343 --lean-out .lake/CatalogRow343.lean
          lake env lean .lake/CatalogRow343.lean
      - name: Replay the proof above Init
        run: |
          replay=../mabk-uniform-randomness/review/DependencyReplay.lean
          lake env lean --run "$replay" CheegerMinimum CheegerPareto.minimum_counterexample_order
          lake env lean --run "$replay" CheegerTen CheegerPareto.Ten.excluded_by_tree
          lake env lean --run "$replay" CheegerTen CheegerPareto.Ten.nonunique_at_eighteen
          lake env lean --run "$replay" CheegerTen CheegerPareto.Ten.efficient_minima
